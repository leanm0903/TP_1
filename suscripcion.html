<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/noti.css">
    <link rel="stylesheet" href="./assets/css/suscripcion.css">
    <title>Suscripción - Diario Online</title>
</head>
<body>
    <header>
        <nav class="site-nav">
            <div class="nav-bar">
                <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Abrir menú">
                <div class="brand">
                    <label for="nav-toggle" class="burguer" aria-hidden="false">
                        <span></span>
                        <span></span>
                        <span></span>
                    </label>
                    <img src="./assets/img/lacap.png" alt="Logo">
                </div>
                <div class="nav-links">
                    <ul class="">
                        <li><a href="index.html">Ultimas Noticias</a></li>
                        <li><a href="#">Sección 2</a></li>
                        <li><a href="#">Sección 3</a></li>
                        <li><a href="#">Sección 4</a></li>
                        <li><a href="#">Sección 5</a></li>
                    </ul>
                    <button class="login">Ingresar</button>
                </div>
            </div>
        </nav>
    </header>

    <main>

        
        <form id="formulario-suscripcion">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
                    <p class="error-msg" id="error-nombre"></p>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com">
                    <p class="error-msg" id="error-email"></p>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password">
                    <p class="error-msg" id="error-password"></p>
                </div>
                <div class="form-group">
                    <label for="repeat-password">Repetir Contraseña</label>
                    <input type="password" id="repeat-password">
                    <p class="error-msg" id="error-repeat-password"></p>
                </div>
                <div class="form-group">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" placeholder="Mayor a 18">
                    <p class="error-msg" id="error-edad"></p>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono">
                    <p class="error-msg" id="error-telefono"></p>
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion">
                    <p class="error-msg" id="error-direccion"></p>
                </div>
                <div class="form-group">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad">
                    <p class="error-msg" id="error-ciudad"></p>
                </div>
                <div class="form-group">
                    <label for="cp">Código Postal</label>
                    <input type="text" id="cp">
                    <p class="error-msg" id="error-cp"></p>
                </div>
                <div class="form-group">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni">
                    <p class="error-msg" id="error-dni"></p>
                </div>
                
                <div class="form-group full-width btn-container">
                    <button type="submit" id="btn-enviar">Enviar</button>
                </div>
            </div>
        </form>
    </main>

    <script src="./assets/js/suscripcion.js"></script>
</body>
</html>
